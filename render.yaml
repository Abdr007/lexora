# Render blueprint — the no-card deployment path.
#
# Render's free web-service tier needs no credit card and builds a Dockerfile directly.
# The constraint is 512 MB of RAM; Lexora measures 155 MB at steady state with both ONNX
# sessions loaded, so it fits with roughly 3x headroom.
#
# The real trade is idling: a free service sleeps after 15 minutes and a cold start is
# container boot plus an ONNX load — call it 60-90 seconds. Warm it before a demo
# (`curl $URL/api/health`) or use `render.com` → Settings → keep-alive.
#
# Deploy: push this repo to GitHub, then render.com → New → Blueprint → pick the repo.

services:
  - type: web
    name: lexora-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt          # closest free region to the UAE
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects $PORT; the container entrypoint already honours it.
      - key: LEXORA_CORS_ALLOW_ORIGINS
        value: https://lexora.vercel.app
      # Set this in the Render dashboard as a SECRET, never here.
      - key: LEXORA_ANTHROPIC_API_KEY
        sync: false
